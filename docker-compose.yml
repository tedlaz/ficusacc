services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ficusacc-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/accounting.db
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
      - BACKEND_CORS_ORIGINS=["*"]
    ports:
      - "8012:8000"
    volumes:
      # - backend-data:/app/data
      - ./database:/app/data
    networks:
      - homeacct-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ficusacc-frontend
    restart: unless-stopped
    ports:
      - "8013:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homeacct-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  homeacct-network:
    driver: bridge

