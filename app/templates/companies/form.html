{% extends 'partials/modal.html' %}
{% from 'macros/icons.html' import icon %}
{% block modal_content %}
<form method="post" action="{{ url_for('web.company_edit', company_id=company.id) if company else url_for('web.company_new') }}" class="modal-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><p class="eyebrow">Ρυθμίσεις εταιρείας</p><h2>{{ company.name if company else 'Νέα εταιρεία' }}</h2></div><label>Επωνυμία<input name="name" maxlength="200" required value="{{ company.name if company else '' }}"></label><div class="form-grid"><label>Κωδικός<input name="code" maxlength="20" required value="{{ company.code if company else '' }}" oninput="this.value=this.value.toUpperCase()"></label><label>Νόμισμα<select name="currency"><option value="EUR" {% if not company or company.currency == 'EUR' %}selected{% endif %}>€</option>{% if company and company.currency != 'EUR' %}<option value="{{ company.currency }}" selected>{{ company.currency }}</option>{% endif %}</select></label></div><label>Μήνας έναρξης χρήσης<input type="number" name="fiscal_year_start_month" min="1" max="12" value="{{ company.fiscal_year_start_month if company else 1 }}"></label>{% if company %}<label class="check"><input type="checkbox" name="is_active" {% if company.is_active %}checked{% endif %}> Ενεργή εταιρεία</label>{% endif %}<div class="form-actions"><button type="button" class="icon-action" data-modal-close data-tooltip="Ακύρωση" aria-label="Ακύρωση">{{ icon('close') }}</button><button class="icon-action icon-action-primary" data-tooltip="Αποθήκευση" aria-label="Αποθήκευση">{{ icon('save') }}</button></div></form>
{% endblock %}
