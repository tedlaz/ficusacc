{% extends 'partials/modal.html' %}
{% from 'macros/icons.html' import icon %}
{% block modal_content %}
<form method="post" action="{{ url_for('web.user_edit', user_id=user.id) if user else url_for('web.user_new') }}" class="modal-form"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><p class="eyebrow">Λογαριασμός</p><h2>{{ user.full_name if user else 'Νέος χρήστης' }}</h2></div><label>Ονοματεπώνυμο<input name="full_name" required maxlength="200" value="{{ user.full_name if user else '' }}"></label><label>Email<input type="email" name="email" required value="{{ user.email if user else '' }}"></label>{% if not user %}<label>Αρχικός κωδικός<input type="password" name="password" required minlength="8"></label>{% endif %}{% if user %}<label class="check"><input type="checkbox" name="is_active" {% if user.is_active %}checked{% endif %}> Ενεργός</label>{% endif %}{% if g.user.is_superuser %}<label class="check"><input type="checkbox" name="is_superuser" {% if user and user.is_superuser %}checked{% endif %}> Διαχειριστής συστήματος</label>{% endif %}<div class="form-actions"><button type="button" class="icon-action" data-modal-close data-tooltip="Ακύρωση" aria-label="Ακύρωση">{{ icon('close') }}</button><button class="icon-action icon-action-primary" data-tooltip="Αποθήκευση" aria-label="Αποθήκευση">{{ icon('save') }}</button></div></form>
{% endblock %}
