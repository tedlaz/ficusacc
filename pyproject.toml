[project]
name = "ficusacc"
version = "0.1.0"
description = "Multi-tenant double-entry accounting application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.0",
  "fpdf2>=2.8.0",
  "waitress>=3.0.0",
  "sqlmodel>=0.0.22",
  "pwdlib[argon2]>=0.2.0",
  "alembic>=1.14.0",
  "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
