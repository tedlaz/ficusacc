[project]
name = "ficusacc"
version = "0.1.0"
description = "Multi-tenant double-entry accounting application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "flask>=3.1.0",
  "fpdf2>=2.8.8",
  "waitress>=3.0.0",
  "sqlmodel>=0.0.42",
  "pwdlib[argon2]>=0.3.1",
  "alembic>=1.20.0",
  "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "ruff>=0.16.8",
  "mypy>=2.3.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
